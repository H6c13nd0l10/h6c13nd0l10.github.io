<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portadas del Mapa del delito</title>
<style>
:root {
  color-scheme: light dark;
  --fondo: #f4f3f0; --superficie: #fff; --texto: #1c1c1e; --tenue: #5f5f66;
  --borde: #d8d6d0; --acento: #a3271f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #141416; --superficie: #1f1f22; --texto: #f0efec; --tenue: #a9a9b0;
    --borde: #38383d; --acento: #f07f75;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 28px 16px; background: var(--fondo); color: var(--texto);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.contenedor { max-width: 720px; margin: 0 auto; }
h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: -.01em; }
header p { margin: 4px 0 22px; color: var(--tenue); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li a {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 14px 16px;
  color: inherit; text-decoration: none; background: var(--superficie);
  border: 1px solid var(--borde); border-radius: 10px;
}
li a:hover { border-color: var(--acento); }
li a:hover strong { text-decoration: underline; }
li.ultima a { border-color: var(--acento); border-width: 2px; padding: 18px 16px; }
li.ultima strong { font-size: 1.15rem; }
.marca {
  flex-basis: 100%; color: var(--acento); font-size: .78rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
}
.dato { color: var(--tenue); font-size: .9rem; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <h1>Portadas del Mapa del delito</h1>
    <p>Una galería por semana con las noticias policiales del mapa. Elegí una semana.</p>
  </header>
  <ul>
    <li class="ultima"><a href="2026-11-21/" target="_blank" rel="noopener noreferrer"><span class="marca">Última</span><strong>Semana del 15/11 al 21/11/2026</strong><span class="dato">581 notas</span></a></li>
  </ul>
</div>
<script>
// Regla de la serie: todo enlace abre en una pestaña nueva
document.querySelectorAll('a[href]:not([href^="#"])').forEach(function (a) {
  a.target = "_blank"; a.rel = "noopener noreferrer";
});
</script>
</body>
</html>
